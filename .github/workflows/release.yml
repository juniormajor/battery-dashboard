# Release bei Versionswechsel (A01d E11): Bei jedem Push auf main prueft der Workflow, ob es zur
# Version aus package.json schon ein Release gibt. Wenn nicht, baut er und legt Tag und Release
# v<Version> mit dist/battery-dashboard.js an. Tags werden nicht gepusht; ein mit GITHUB_TOKEN
# angelegter Tag loest keinen weiteren Lauf aus.
name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Version pruefen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag gibt es schon, nichts zu tun."
            echo "neu=false" >> "$GITHUB_OUTPUT"
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Abhaengigkeiten
        if: steps.version.outputs.neu == 'true'
        run: npm ci

      - name: Bauen
        if: steps.version.outputs.neu == 'true'
        run: npm run build

      - name: Tag und Release mit battery-dashboard.js
        if: steps.version.outputs.neu == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" dist/battery-dashboard.js --target "$GITHUB_SHA" --title "${{ steps.version.outputs.tag }}" --generate-notes
