# Release on version change (A01d E11): on every push to main the workflow checks whether a release
# exists for the version in package.json. If not, it builds and creates tag and release v<version>
# with dist/battery-dashboard.js. Tags are not pushed; a tag created with GITHUB_TOKEN does not
# trigger another run.
name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Check version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists already, nothing to do."
            echo "neu=false" >> "$GITHUB_OUTPUT"
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.neu == 'true'
        run: npm ci

      - name: Build
        if: steps.version.outputs.neu == 'true'
        run: npm run build

      - name: Tag and release with battery-dashboard.js
        if: steps.version.outputs.neu == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" dist/battery-dashboard.js --target "$GITHUB_SHA" --title "${{ steps.version.outputs.tag }}" --generate-notes
